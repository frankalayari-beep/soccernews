<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Football Jam</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c14;
      --surface: #121a2a;
      --surface-light: #1e293b;
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1f2a40;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; overflow-x: hidden; }

    /* App Header */
    .app-bar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(8, 12, 20, 0.95); backdrop-filter: blur(14px);
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .drawer-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
    }
    .saved-count-dot {
      position: absolute; top: -4px; right: -4px; background: var(--gold); color: #000;
      font-size: 0.65rem; font-weight: 900; width: 18px; height: 18px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
    }
    .brand-logo {
      display: flex; align-items: center; gap: 7px; direction: ltr;
      font-size: 1.32rem; font-weight: 900; letter-spacing: 1.5px; color: #fff;
    }
    .ball-svg { width: 25px; height: 25px; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.25)); }
    .trophy-svg { width: 30px; height: 30px; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5)); }

    /* Search Box */
    .search-wrap { position: relative; width: 100%; margin-bottom: 10px; }
    .search-icon {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none;
    }
    .search-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 42px 10px 14px; border-radius: 12px;
      font-size: 0.88rem; outline: none;
    }
    .search-input:focus { border-color: var(--gold); }

    /* Filter, Sort & Refresh Toolbar */
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 42px; gap: 8px; align-items: center; }
    .tool-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      height: 40px; padding: 0 10px; border-radius: 11px; font-size: 0.78rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
      white-space: nowrap; overflow: hidden;
    }
    .tool-btn svg { width: 16px; height: 16px; color: var(--gold); flex-shrink: 0; }
    .refresh-icon-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--gold-light);
      width: 42px; height: 40px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: transform 0.25s ease;
    }
    .refresh-icon-btn:active { transform: rotate(180deg); border-color: var(--gold); }

    /* Feed Container & Swipeable Hot Hero Slider */
    .container { padding: 14px 16px; max-width: 600px; margin: 0 auto; }
    .hero-slider {
      position: relative; border-radius: 18px; overflow: hidden; height: 248px;
      margin-bottom: 18px; border: 1px solid rgba(245, 158, 11, 0.35);
      background: #000; touch-action: pan-y;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .hero-slide-inner {
      width: 100%; height: 100%; position: relative; cursor: pointer;
      animation: fadeSlide 0.28s ease-out;
    }
    @keyframes fadeSlide {
      from { opacity: 0.45; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }
    .hero-slide-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(8,12,20,0.98) 14%, rgba(8,12,20,0.2) 100%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 16px 16px 26px;
    }
    .bookmark-Quick {
      position: absolute; top: 12px; left: 12px; z-index: 6;
      background: rgba(8, 12, 20, 0.8); backdrop-filter: blur(6px);
      border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff;
    }
    .bookmark-Quick.saved { background: var(--gold); color: #000; border-color: var(--gold); }
    .hot-tag-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .hot-badge {
      background: linear-gradient(135deg, #f59e0b, #dc2626); color: #fff;
      font-size: 0.7rem; font-weight: 900; padding: 3px 10px; border-radius: 6px;
      box-shadow: 0 2px 10px rgba(220, 38, 38, 0.4);
    }
    .news-code-badge {
      background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--gold-light); font-size: 0.7rem; font-weight: 800; padding: 3px 9px; border-radius: 6px;
    }
    .hero-title { font-size: 1.02rem; font-weight: 800; line-height: 1.55; color: #fff; margin-bottom: 6px; }
    .hero-date { font-size: 0.7rem; color: var(--muted); }
    .slider-dots {
      position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 6;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35);
      transition: all 0.25s ease; cursor: pointer;
    }
    .dot.active { width: 20px; border-radius: 10px; background: var(--gold); }

    /* News List */
    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-item {
      position: relative; display: flex; gap: 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; padding: 10px; align-items: center; cursor: pointer;
    }
    .thumb { width: 96px; height: 86px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #000; }
    .item-content { flex: 1; min-width: 0; }
    .item-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .item-code { font-size: 0.72rem; color: var(--gold-light); font-weight: 800; }
    .item-bookmark {
      background: transparent; border: none; color: var(--muted); padding: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .item-bookmark.saved { color: var(--gold); }
    .item-title {
      font-size: 0.88rem; font-weight: 700; line-height: 1.55; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px;
    }
    .item-date { font-size: 0.68rem; color: var(--muted); }

    /* Full Article View */
    .article-page {
      position: fixed; inset: 0; background: var(--bg); z-index: 90;
      overflow-y: auto; display: none; flex-direction: column;
    }
    .article-page.open { display: flex; }
    .article-topbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(8, 12, 20, 0.94); backdrop-filter: blur(12px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .article-actions { display: flex; align-items: center; gap: 8px; }
    .top-btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 700;
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .top-btn.saved { background: var(--gold); color: #000; border-color: var(--gold); }
    .article-container { max-width: 600px; margin: 0 auto; width: 100%; padding-bottom: 40px; }
    .article-hero-img { width: 100%; height: 245px; object-fit: cover; display: block; background: #000; }
    .article-body { padding: 18px 16px; }
    .article-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.76rem; color: var(--muted); }
    .article-headline { font-size: 1.18rem; font-weight: 900; line-height: 1.65; color: #fff; margin-bottom: 16px; user-select: text; }
    .article-lead {
      background: var(--surface); border-right: 4px solid var(--gold);
      padding: 12px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 700;
      line-height: 1.8; color: #e2e8f0; margin-bottom: 18px; user-select: text;
    }
    .article-paragraph { font-size: 0.95rem; line-height: 2; color: #cbd5e1; margin-bottom: 16px; text-align: justify; user-select: text; }

    /* Left Slide-out Drawer (Silver Metallic Theme) */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 110;
      display: none;
    }
    .drawer-backdrop.open { display: block; }
    .left-drawer {
      position: fixed; top: 0; bottom: 0; left: 0; width: 85%; max-width: 340px;
      background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
      color: #0f172a;
      border-right: 2px solid #94a3b8; z-index: 120;
      transform: translateX(-100%); transition: transform 0.25s ease;
      display: flex; flex-direction: column;
      box-shadow: 6px 0 24px rgba(0,0,0,0.5);
    }
    .left-drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 14px 16px; border-bottom: 1px solid #94a3b8;
      background: rgba(255, 255, 255, 0.55);
      display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-title { font-size: 0.95rem; font-weight: 900; color: #0f172a; }
    .drawer-close-btn {
      background: #0f172a; color: #fff; border: none;
      width: 32px; height: 32px; border-radius: 8px; font-weight: 800; cursor: pointer;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px; }
    .drawer-body .news-item {
      background: #f8fafc; border: 1px solid #94a3b8;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }
    .drawer-body .item-title { color: #0f172a; }
    .drawer-body .item-code { color: #b45309; }
    .drawer-body .status { color: #334155; font-weight: 700; }
    .drawer-footer {
      padding: 12px 14px; border-top: 1px solid #94a3b8; background: #cbd5e1;
      display: flex; flex-direction: column; gap: 7px;
    }
    .footer-link {
      background: #f8fafc; border: 1px solid #94a3b8; color: #0f172a;
      padding: 9px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 800;
      text-align: right; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }

    /* Filter / Sort / Info Sheet Modal */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 130;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet-box {
      background: var(--surface); width: 100%; max-width: 600px;
      border-radius: 22px 22px 0 0; padding: 18px; border-top: 1px solid var(--border);
      max-height: 80vh; overflow-y: auto;
    }
    .sheet-title { font-size: 0.98rem; font-weight: 800; margin-bottom: 14px; color: var(--gold-light); }
    .option-list { display: flex; flex-direction: column; gap: 8px; }
    .option-item {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 11px 14px; border-radius: 11px; font-size: 0.86rem; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .option-item.selected { border-color: var(--gold); color: var(--gold-light); background: rgba(245, 158, 11, 0.1); }

    /* Exit Confirmation Toast */
    .exit-toast {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.96); color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 11px 20px; border-radius: 30px; font-size: 0.84rem; font-weight: 800;
      z-index: 5000; opacity: 0; pointer-events: none; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.65);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .exit-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Post-Ad Golden Trophy + JAM Intro Splash Screen */
    .jam-splash {
      position: fixed; inset: 0; z-index: 9500;
      background: radial-gradient(circle at center, #131d33 0%, #060911 75%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .jam-splash.active { display: flex; }
    .jam-emblem {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
      opacity: 0.08;
      filter: blur(6px) brightness(0.35);
      transform: scale(0.84);
    }
    .jam-splash.animate .jam-emblem {
      animation: jamFadeBrightShine 2.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .splash-trophy-svg {
      width: 138px; height: 138px;
      margin-bottom: 14px;
    }
    .splash-jam-title {
      font-size: 2.75rem; font-weight: 900; letter-spacing: 9px; direction: ltr;
      background: linear-gradient(90deg, #b45309 0%, #fde047 45%, #ffffff 50%, #fbbf24 55%, #b45309 100%);
      background-size: 220% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: textShimmer 2.2s linear infinite;
    }
    @keyframes textShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    @keyframes jamFadeBrightShine {
      0% {
        opacity: 0.08;
        filter: blur(7px) brightness(0.3);
        transform: scale(0.84);
      }
      35% {
        opacity: 0.55;
        filter: blur(1.5px) brightness(0.95);
        transform: scale(0.97);
      }
      68% {
        opacity: 1;
        filter: blur(0px) brightness(1.45) drop-shadow(0 0 38px rgba(251, 191, 36, 0.95)) drop-shadow(0 0 80px rgba(245, 158, 11, 0.6));
        transform: scale(1.06);
      }
      85% {
        opacity: 1;
        filter: blur(0px) brightness(1.25) drop-shadow(0 0 28px rgba(251, 191, 36, 0.85));
        transform: scale(1.02);
      }
      100% {
        opacity: 0;
        filter: blur(3px) brightness(1.5);
        transform: scale(1.12);
      }
    }

    /* Mandatory Adsterra Overlay */
    .ad-overlay {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: none; flex-direction: column;
    }
    .ad-overlay.open { display: flex; }
    .ad-close-btn {
      position: absolute; top: 16px; right: 16px; z-index: 10000;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(18, 26, 42, 0.92); border: 2px solid var(--gold);
      color: #fff; font-size: 1.2rem; font-weight: 900;
      display: none; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }
    .ad-iframe { width: 100%; height: 100%; border: none; background: #080c14; }
    .status { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.88rem; }
  </style>
</head>
<body>

  <!-- تبلیغ اجباری ۱۵ ثانیه‌ای (بدون نمایش تایمر به کاربر) -->
  <div class="ad-overlay" id="ad-overlay">
    <button class="ad-close-btn" id="ad-close-btn" onclick="closeAd()">✕</button>
    <iframe class="ad-iframe" id="ad-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <!-- صفحه انیمیشن جام طلایی و نوشته JAM بلافاصله پس از بسته شدن تبلیغ اول -->
  <div class="jam-splash" id="jam-splash">
    <div class="jam-emblem">
      <svg class="splash-trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 10H46V24C46 33.5 39.5 40 32 40C24.5 40 18 33.5 18 24V10Z" fill="url(#splashGoldGrad)" stroke="#FEF08A" stroke-width="2"/>
        <path d="M18 14H10V22C10 27 13.5 31 18 31" stroke="#FBBF24" stroke-width="3.8" stroke-linecap="round"/>
        <path d="M46 14H54V22C54 27 50.5 31 46 31" stroke="#FBBF24" stroke-width="3.8" stroke-linecap="round"/>
        <path d="M28 40H36V49H28V40Z" fill="#D97706"/>
        <path d="M20 49H44L46 56H18L20 49Z" fill="url(#splashGoldGrad)" stroke="#FEF08A" stroke-width="1.5"/>
        <circle cx="32" cy="22" r="7" fill="#FEF9C3" opacity="0.9"/>
        <defs>
          <linearGradient id="splashGoldGrad" x1="18" y1="10" x2="46" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FEF08A"/>
            <stop offset="0.5" stop-color="#F59E0B"/>
            <stop offset="1" stop-color="#B45309"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="splash-jam-title">JAM</div>
    </div>
  </div>

  <!-- اعلان خروج دو مرحله‌ای با خط سفید در پایین صفحه -->
  <div class="exit-toast" id="exit-toast">جهت خروج از برنامه، یک‌بار دیگر دکمه بازگشت را بزنید</div>

  <!-- هدر اصلی اپ -->
  <header class="app-bar">
    <div class="top-row">
      <!-- برند: توپ فوتبال در چپ + FOOTBALL + جام طلایی در راست -->
      <div class="brand-logo">
        <svg class="ball-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
          <polygon points="32,18 43,26 39,39 25,39 21,26" fill="#0F172A"/>
          <path d="M32 4V18M43 26L56 20M39 39L48 52M25 39L16 52M21 26L8 20" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="32" cy="32" r="28" stroke="#0F172A" stroke-width="3"/>
        </svg>
        <span>FOOTBALL</span>
        <svg class="trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 10H46V24C46 33.5 39.5 40 32 40C24.5 40 18 33.5 18 24V10Z" fill="url(#goldGrad)" stroke="#FDE68A" stroke-width="2"/>
          <path d="M18 14H10V22C10 27 13.5 31 18 31" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M46 14H54V22C54 27 50.5 31 46 31" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M28 40H36V49H28V40Z" fill="#D97706"/>
          <path d="M20 49H44L46 56H18L20 49Z" fill="url(#goldGrad)" stroke="#FDE68A" stroke-width="1.5"/>
          <circle cx="32" cy="22" r="6" fill="#FEF3C7" opacity="0.85"/>
          <defs>
            <linearGradient id="goldGrad" x1="18" y1="10" x2="46" y2="56" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FDE047"/>
              <stop offset="0.5" stop-color="#F59E0B"/>
              <stop offset="1" stop-color="#B45309"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- زبانه سه خطی بالا سمت چپ -->
      <button class="drawer-btn" onclick="openDrawer()" title="منو و اخبار نشان‌شده">
        <span class="saved-count-dot" id="saved-badge">0</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- کادر جستجو فقط با آیکون ذره‌بین و متن جستجو در اخبار -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search" class="search-input" placeholder="جستجو در اخبار" />
    </div>

    <!-- نوار ابزار: فیلتر (راست) + مرتب‌سازی (وسط) + دکمه بروزرسانی (چپِ مرتب‌سازی) -->
    <div class="toolbar">
      <button class="tool-btn" id="filter-btn" onclick="openFilterSheet()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        <span id="filter-label">فیلتر: همه اخبار</span>
      </button>

      <button class="tool-btn" id="sort-btn" onclick="openSortSheet()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="4" y1="6" x2="13" y2="6"></line>
          <line x1="4" y1="12" x2="11" y2="12"></line>
          <line x1="4" y1="18" x2="11" y2="18"></line>
          <polyline points="15 15 18 18 21 15"></polyline>
          <line x1="18" y1="6" x2="18" y2="18"></line>
        </svg>
        <span id="sort-label">مرتب‌سازی: جدیدترین</span>
      </button>

      <button class="refresh-icon-btn" onclick="loadNews(true)" title="بروزرسانی اخبار">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- لیست اصلی اخبار -->
  <main class="container" id="app-content">
    <div class="status">در حال بارگذاری اخبار...</div>
  </main>

  <!-- صفحه کامل خبر داخل اپ (دکمه اشتراک‌گذاری کنار نشان کردن) -->
  <div class="article-page" id="article-page">
    <div class="article-topbar">
      <button class="top-btn" onclick="closeArticle()">→ بازگشت</button>
      <div class="article-actions">
        <button class="top-btn" id="article-share-btn" onclick="shareCurrentArticle()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>اشتراک‌گذاری</span>
        </button>
        <button class="top-btn" id="article-bookmark-btn">نشان کردن</button>
      </div>
    </div>
    <div class="article-container" id="article-content"></div>
  </div>

  <!-- منوی کشویی سمت چپ با پس‌زمینه نقره‌ای -->
  <div class="drawer-backdrop" id="drawer-backdrop" onclick="closeDrawer()"></div>
  <aside class="left-drawer" id="left-drawer">
    <div class="drawer-header">
      <span class="drawer-title">اخبار نشان‌شده</span>
      <button class="drawer-close-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="saved-list"></div>
    <div class="drawer-footer">
      <button class="footer-link" onclick="openInfoModal('about')">
        <span>درباره ما</span>
        <span>❮</span>
      </button>
      <button class="footer-link" onclick="openInfoModal('rules')">
        <span>قوانین و مقررات</span>
        <span>❮</span>
      </button>
      <button class="footer-link" onclick="openInfoModal('contact')">
        <span>تماس با ما</span>
        <span>❮</span>
      </button>
    </div>
  </aside>

  <!-- پنجره پایین‌صفحه برای فیلتر، مرتب‌سازی، درباره ما، قوانین و تماس با ما -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="if(event.target===this) closeSheet()">
    <div class="sheet-box" id="sheet-box"></div>
  </div>

  <script>
    const GITHUB_REPO = "frankalayari-beep/soccernews";
    const REMOTE_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/news.json`;

    // لینک تبلیغاتی اختصاصی شما
    const ADSTERRA_URL = "https://asiafilm.org/4/052064ca4ffd0916d363a8d4ca962a64";

    let allNews = [];
    let savedMap = JSON.parse(localStorage.getItem('fj_saved_news') || '{}');
    let currentFilter = 'ALL';
    let currentSort = 'NEWEST';
    let adOpen = false;
    let splashOpen = false;
    let isFirstStartupAd = true;
    let lastBackPressTime = 0;

    // متغیرهای اسلایدر اخبار داغ بالای صفحه
    let hotHeroList = [];
    let currentHeroIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    const FILTER_NAMES = {
      'ALL': 'همه اخبار',
      'iran': 'فوتبال ایران',
      'world': 'فوتبال اروپا و جهان',
      'transfer': 'نقل و انتقالات',
      'ucl': 'لیگ قهرمانان',
      'national': 'ملی و جام جهانی'
    };

    const SORT_NAMES = {
      'NEWEST': 'جدیدترین',
      'OLDEST': 'قدیمی‌ترین',
      'SAVED_FIRST': 'نشان‌شده‌ها در صدر'
    };

    function toShamsi(isoStr) {
      try {
        const d = isoStr ? new Date(isoStr) : new Date();
        if (isNaN(d.getTime())) return 'امروز';
        return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        }).format(d);
      } catch (e) {
        return '';
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('exit-toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    // سیستم تبلیغ اجباری ۱۵ ثانیه‌ای بدون نمایش تایمر به کاربر
    function triggerMandatoryAd() {
      if (!ADSTERRA_URL) return;
      adOpen = true;
      const overlay = document.getElementById('ad-overlay');
      const closeBtn = document.getElementById('ad-close-btn');
      const iframe = document.getElementById('ad-iframe');

      closeBtn.style.display = 'none';
      iframe.src = ADSTERRA_URL;
      overlay.classList.add('open');

      setTimeout(() => {
        closeBtn.style.display = 'flex';
      }, 15000);
    }

    function closeAd() {
      adOpen = false;
      document.getElementById('ad-overlay').classList.remove('open');
      document.getElementById('ad-iframe').src = 'about:blank';

      // اجرای انیمیشن جام طلایی + JAM بلافاصله پس از پایان تبلیغ ابتدایی برنامه
      if (isFirstStartupAd) {
        isFirstStartupAd = false;
        playJamIntroSplash();
      }
    }

    function playJamIntroSplash() {
      splashOpen = true;
      const splash = document.getElementById('jam-splash');
      splash.classList.add('active', 'animate');
      setTimeout(() => {
        splash.classList.remove('active', 'animate');
        splashOpen = false;
      }, 2900);
    }

    // تایمر مخفی ۳۰ دقیقه‌ای استفاده از اپ
    setInterval(() => {
      if (!adOpen && !splashOpen) triggerMandatoryAd();
    }, 30 * 60 * 1000);

    function updateSavedBadge() {
      const count = Object.keys(savedMap).length;
      const badge = document.getElementById('saved-badge');
      badge.textContent = count;
      badge.style.display = count > 0 ? 'flex' : 'none';
    }

    function toggleBookmarkById(newsId, ev) {
      if (ev) ev.stopPropagation();
      const item = allNews.find(n => String(n.news_id) === String(newsId)) || savedMap[String(newsId)];
      if (!item) return;
      const key = String(item.news_id || item.link);
      if (savedMap[key]) {
        delete savedMap[key];
      } else {
        savedMap[key] = item;
      }
      localStorage.setItem('fj_saved_news', JSON.stringify(savedMap));
      updateSavedBadge();
      renderHeroSlide();
      renderListOnly();
      if (document.getElementById('left-drawer').classList.contains('open')) {
        renderSavedDrawer();
      }
    }

    function isBookmarked(item) {
      return Boolean(savedMap[String(item.news_id || item.link)]);
    }

    // محاسبه امتیاز جذابیت و پربازدید بودن خبر برای اسلایدر بالای صفحه
    function computeHotScore(item) {
      let score = 0;
      const text = `${item.title} ${(item.content || []).join(' ')}`;
      const hotKeywords = [
        "فوری", "رسمی", "پرسپولیس", "استقلال", "رئال مادرید", "بارسلونا", "منچستر",
        "لیورپول", "آرسنال", "بایرن", "لیگ قهرمانان", "تیم ملی", "جام جهانی",
        "نقل و انتقالات", "قرارداد", "ستاره", "دربی", "سپاهان", "تراکتور", "شوک", "رکورد"
      ];
      hotKeywords.forEach(kw => {
        if (text.includes(kw)) score += 18;
      });
      if (Array.isArray(item.content)) score += item.content.length * 4;
      if (item.image && !item.image.includes("unsplash.com")) score += 25;
      return score + ((item.news_id || 1000) * 0.05);
    }

    async function loadNews(manual = false) {
      const container = document.getElementById('app-content');
      if (manual) showToast('در حال بروزرسانی آخرین اخبار...');
      try {
        const res = await fetch(REMOTE_JSON_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error();
        const raw = await res.json();
        allNews = raw.map((item, idx) => ({
          ...item,
          news_id: item.news_id || (1000 + raw.length - idx),
          category: item.category || 'world'
        }));
        render();
      } catch (e) {
        container.innerHTML = `<div class="status">در حال همگام‌سازی اخبار جدید...</div>`;
      }
    }

    function render() {
      const container = document.getElementById('app-content');
      const q = document.getElementById('search').value.trim().toLowerCase();

      let list = allNews.filter(n => {
        const matchCat = currentFilter === 'ALL' || n.category === currentFilter;
        const bodyText = Array.isArray(n.content) ? n.content.join(' ') : (n.summary || '');
        const matchQ = !q || n.title.toLowerCase().includes(q) || bodyText.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      if (currentSort === 'NEWEST') {
        list.sort((a, b) => (b.news_id || 0) - (a.news_id || 0));
      } else if (currentSort === 'OLDEST') {
        list.sort((a, b) => (a.news_id || 0) - (b.news_id || 0));
      } else if (currentSort === 'SAVED_FIRST') {
        list.sort((a, b) => Number(isBookmarked(b)) - Number(isBookmarked(a)) || (b.news_id - a.news_id));
      }

      if (!list.length) {
        container.innerHTML = `<div class="status">خبری با این مشخصات یافت نشد.</div>`;
        return;
      }

      // انتخاب تا ۵ خبر جذاب و پربازدید برای اسلایدر لمسی بالای صفحه
      const scored = [...list].sort((a, b) => computeHotScore(b) - computeHotScore(a));
      hotHeroList = scored.slice(0, Math.min(5, scored.length));
      if (currentHeroIndex >= hotHeroList.length) currentHeroIndex = 0;

      const hotIds = new Set(hotHeroList.map(h => h.news_id));
      window.currentRemainingList = list.filter(n => !hotIds.has(n.news_id));
      if (!window.currentRemainingList.length) {
        window.currentRemainingList = list.slice(1);
      }

      container.innerHTML = `
        <div class="hero-slider" id="hero-slider"></div>
        <div class="news-list" id="news-list-box"></div>
      `;

      setupHeroTouchEvents();
      renderHeroSlide();
      renderListOnly();
    }

    function renderHeroSlide() {
      const slider = document.getElementById('hero-slider');
      if (!slider || !hotHeroList.length) return;
      const hero = hotHeroList[currentHeroIndex];
      const heroSaved = isBookmarked(hero);

      const dotsHtml = hotHeroList.map((_, idx) =>
        `<span class="dot ${idx === currentHeroIndex ? 'active' : ''}" onclick="goToHeroSlide(${idx}, event)"></span>`
      ).join('');

      slider.innerHTML = `
        <div class="hero-slide-inner" onclick="openArticleById(${hero.news_id})">
          <button class="bookmark-Quick ${heroSaved ? 'saved' : ''}" onclick="toggleBookmarkById(${hero.news_id}, event)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="${heroSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <img src="${hero.image}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'" />
          <div class="hero-overlay">
            <div class="hot-tag-row">
              <span class="hot-badge">🔥 داغ و پربازدید (${currentHeroIndex + 1}/${hotHeroList.length})</span>
              <span class="news-code-badge">شماره خبر: ${hero.news_id}</span>
            </div>
            <h2 class="hero-title">${hero.title}</h2>
            <div class="hero-date">${toShamsi(hero.timestamp)}</div>
          </div>
          <div class="slider-dots">${dotsHtml}</div>
        </div>
      `;
    }

    function goToHeroSlide(idx, ev) {
      if (ev) ev.stopPropagation();
      currentHeroIndex = idx;
      renderHeroSlide();
    }

    function nextHeroSlide() {
      if (hotHeroList.length <= 1) return;
      currentHeroIndex = (currentHeroIndex + 1) % hotHeroList.length;
      renderHeroSlide();
    }

    function prevHeroSlide() {
      if (hotHeroList.length <= 1) return;
      currentHeroIndex = (currentHeroIndex - 1 + hotHeroList.length) % hotHeroList.length;
      renderHeroSlide();
    }

    function setupHeroTouchEvents() {
      const slider = document.getElementById('hero-slider');
      if (!slider) return;

      slider.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      slider.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 38) {
          if (diff < 0) {
            nextHeroSlide();
          } else {
            prevHeroSlide();
          }
        }
      }, { passive: true });
    }

    function renderListOnly() {
      const listBox = document.getElementById('news-list-box');
      if (!listBox) return;
      const rest = window.currentRemainingList || [];

      listBox.innerHTML = rest.map(item => {
        const saved = isBookmarked(item);
        return `
          <div class="news-item" onclick="openArticleById(${item.news_id})">
            <img class="thumb" src="${item.image}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=400&q=80'" />
            <div class="item-content">
              <div class="item-top-bar">
                <span class="item-code">شماره خبر: ${item.news_id}</span>
                <button class="item-bookmark ${saved ? 'saved' : ''}" onclick="toggleBookmarkById(${item.news_id}, event)">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="${saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                  </svg>
                </button>
              </div>
              <h3 class="item-title">${item.title}</h3>
              <div class="item-date">${toShamsi(item.timestamp)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openArticleById(newsId) {
      const item = allNews.find(n => String(n.news_id) === String(newsId)) || savedMap[String(newsId)];
      if (!item) return;
      window.currentOpenArticle = item;

      const paragraphs = Array.isArray(item.content) && item.content.length > 0
        ? item.content
        : [item.summary || ''];

      const leadText = paragraphs[0];
      const bodyParagraphs = paragraphs.slice(1);
      const bodyHtml = (bodyParagraphs.length ? bodyParagraphs : [leadText])
        .map(p => `<p class="article-paragraph">${p}</p>`).join('');

      document.getElementById('article-content').innerHTML = `
        <img class="article-hero-img" src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'" />
        <div class="article-body">
          <div class="article-meta-row">
            <span class="news-code-badge" style="margin:0">شماره خبر: ${item.news_id}</span>
            <span>${toShamsi(item.timestamp)}</span>
          </div>
          <h1 class="article-headline">${item.title}</h1>
          <div class="article-lead">${leadText}</div>
          ${bodyHtml}
        </div>
      `;

      syncArticleBookmarkBtn();
      const page = document.getElementById('article-page');
      page.classList.add('open');
      page.scrollTop = 0;
      document.body.style.overflow = 'hidden';
    }

    function shareCurrentArticle() {
      const item = window.currentOpenArticle;
      if (!item) return;
      const paragraphs = Array.isArray(item.content) && item.content.length > 0 ? item.content : [item.summary || ''];
      const shareText = `🏆 ${item.title}\n\n${paragraphs[0]}\n\n⚽ خبر شماره ${item.news_id} در اپلیکیشن Football Jam`;

      if (navigator.share) {
        navigator.share({
          title: item.title,
          text: shareText
        }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText);
        showToast('متن خبر برای اشتراک‌گذاری کپی شد');
      }
    }

    function syncArticleBookmarkBtn() {
      const btn = document.getElementById('article-bookmark-btn');
      const item = window.currentOpenArticle;
      if (!item) return;
      const saved = isBookmarked(item);
      btn.className = `top-btn ${saved ? 'saved' : ''}`;
      btn.textContent = saved ? '✓ نشان‌شده' : 'نشان کردن';
      btn.onclick = () => {
        toggleBookmarkById(item.news_id);
        syncArticleBookmarkBtn();
      };
    }

    function closeArticle() {
      document.getElementById('article-page').classList.remove('open');
      document.body.style.overflow = '';
    }

    // منوی سمت چپ (پس‌زمینه نقره‌ای)
    function openDrawer() {
      renderSavedDrawer();
      document.getElementById('drawer-backdrop').classList.add('open');
      document.getElementById('left-drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer-backdrop').classList.remove('open');
      document.getElementById('left-drawer').classList.remove('open');
    }

    function renderSavedDrawer() {
      const box = document.getElementById('saved-list');
      const list = Object.values(savedMap).sort((a, b) => (b.news_id || 0) - (a.news_id || 0));

      if (!list.length) {
        box.innerHTML = `<div class="status">هنوز خبری را نشان نکرده‌اید.</div>`;
        return;
      }

      box.innerHTML = `<div class="news-list">` + list.map(item => `
        <div class="news-item" onclick="closeDrawer(); openArticleById(${item.news_id})">
          <img class="thumb" src="${item.image}" style="width:72px;height:68px" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=400&q=80'" />
          <div class="item-content">
            <div class="item-top-bar">
              <span class="item-code">شماره خبر: ${item.news_id}</span>
              <button class="item-bookmark saved" style="color:#dc2626;font-weight:900" onclick="toggleBookmarkById(${item.news_id}, event)">✕</button>
            </div>
            <h3 class="item-title" style="font-size:0.82rem">${item.title}</h3>
          </div>
        </div>
      `).join('') + `</div>`;
    }

    // پنجره فیلتر، مرتب‌سازی، درباره ما، قوانین و تماس با ما
    function openFilterSheet() {
      const box = document.getElementById('sheet-box');
      box.innerHTML = `
        <div class="sheet-title">فیلتر موضوعی اخبار</div>
        <div class="option-list">
          ${Object.entries(FILTER_NAMES).map(([k, label]) => `
            <div class="option-item ${currentFilter === k ? 'selected' : ''}" onclick="setFilter('${k}')">
              <span>${label}</span>
              <span>${currentFilter === k ? '✓' : ''}</span>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('sheet-backdrop').classList.add('open');
    }

    function setFilter(k) {
      currentFilter = k;
      currentHeroIndex = 0;
      document.getElementById('filter-label').textContent = `فیلتر: ${FILTER_NAMES[k]}`;
      closeSheet();
      render();
    }

    function openSortSheet() {
      const box = document.getElementById('sheet-box');
      box.innerHTML = `
        <div class="sheet-title">مرتب‌سازی بر اساس</div>
        <div class="option-list">
          ${Object.entries(SORT_NAMES).map(([k, label]) => `
            <div class="option-item ${currentSort === k ? 'selected' : ''}" onclick="setSort('${k}')">
              <span>${label}</span>
              <span>${currentSort === k ? '✓' : ''}</span>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('sheet-backdrop').classList.add('open');
    }

    function setSort(k) {
      currentSort = k;
      document.getElementById('sort-label').textContent = `مرتب‌سازی: ${SORT_NAMES[k]}`;
      closeSheet();
      render();
    }

    function openInfoModal(type) {
      closeDrawer();
      const box = document.getElementById('sheet-box');
      if (type === 'about') {
        box.innerHTML = `
          <div class="sheet-title">درباره ما</div>
          <p class="article-paragraph" style="font-size:0.86rem">
            اپلیکیشن <strong>Football Jam</strong> مرجع تخصصی و هوشمند پوشش لحظه‌ای اخبار فوتبال ایران و جهان است. هدف ما ارائه سریع، دقیق و دسته‌بندی‌شده مهم‌ترین رویدادهای فوتبالی، نقل‌وانتقالات و رقابت‌های باشگاهی و ملی در محیطی مدرن و کاربرپسند برای علاقه‌مندان به فوتبال است.
          </p>
        `;
      } else if (type === 'rules') {
        box.innerHTML = `
          <div class="sheet-title">قوانین و مقررات و حریم خصوصی</div>
          <p class="article-paragraph" style="font-size:0.86rem">
            ۱. اپلیکیشن Football Jam یک پلتفرم خبری ورزشی است که آخرین رویدادهای فوتبال ایران و جهان را به‌صورت لحظه‌ای پوشش می‌دهد.<br><br>
            ۲. این برنامه هیچ‌گونه اطلاعات شخصی یا حریم خصوصی از کاربران دریافت یا ذخیره نمی‌کند و اخبار نشان‌شده صرفاً در حافظه دستگاه شما نگهداری می‌شوند.<br><br>
            ۳. استفاده از مطالب برنامه با ذکر نام اپلیکیشن بلامانع است.
          </p>
        `;
      } else {
        box.innerHTML = `
          <div class="sheet-title">تماس با ما</div>
          <p class="article-paragraph" style="font-size:0.86rem">
            پیشنهادات، انتقادات و درخواست‌های همکاری و تبلیغات خود را می‌توانید از طریق ایمیل پشتیبانی با تیم توسعه Football Jam در میان بگذارید:<br><br>
            <strong style="color:var(--gold-light)">Support: footballjam.app@gmail.com</strong>
          </p>
        `;
      }
      document.getElementById('sheet-backdrop').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('sheet-backdrop').classList.remove('open');
    }

    // مدیریت هوشمند دکمه بازگشت گوشی
    window.handleAndroidBack = function() {
      if (adOpen || splashOpen) return "BLOCKED";
      if (document.getElementById('sheet-backdrop').classList.contains('open')) {
        closeSheet();
        return "HANDLED";
      }
      if (document.getElementById('left-drawer').classList.contains('open')) {
        closeDrawer();
        return "HANDLED";
      }
      if (document.getElementById('article-page').classList.contains('open')) {
        closeArticle();
        return "HANDLED";
      }

      const now = Date.now();
      if (now - lastBackPressTime < 2400) {
        return "EXIT";
      } else {
        lastBackPressTime = now;
        showToast("جهت خروج از برنامه، یک‌بار دیگر دکمه بازگشت را بزنید");
        return "HANDLED";
      }
    };

    document.getElementById('search').addEventListener('input', render);
    updateSavedBadge();
    triggerMandatoryAd();
    loadNews();
  </script>
</body>
</html>
