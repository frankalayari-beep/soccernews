<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>فوتبال پالس | اخبار زنده فوتبال جهان</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #10b981;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #222d42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 14px 16px;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 700px; margin: 0 auto 12px; }
    .brand { font-size: 1.25rem; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 9px; height: 9px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
    .search-box {
      width: 100%; max-width: 700px; margin: 0 auto 12px; display: block;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .filters {
      display: flex; gap: 8px; overflow-x: auto; max-width: 700px; margin: 0 auto;
      padding-bottom: 4px; scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .chip.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
    .container { max-width: 700px; margin: 16px auto; padding: 0 16px; display: grid; gap: 16px; }
    .news-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; transition: transform 0.2s;
    }
    .news-img { width: 100%; height: 200px; object-fit: cover; display: block; background: #000; }
    .news-body { padding: 16px; }
    .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.75rem; color: var(--muted); }
    .badge { background: rgba(16, 185, 129, 0.15); color: var(--accent); padding: 3px 10px; border-radius: 6px; font-weight: 700; }
    .title { font-size: 1.05rem; font-weight: 800; line-height: 1.6; margin-bottom: 8px; color: #fff; }
    .summary { font-size: 0.88rem; color: #cbd5e1; line-height: 1.7; margin-bottom: 14px; }
    .orig-title { font-size: 0.75rem; color: var(--muted); direction: ltr; text-align: left; border-top: 1px dashed var(--border); padding-top: 8px; margin-bottom: 12px; }
    .btn-link {
      display: inline-block; text-decoration: none; background: #1e293b; color: var(--accent);
      padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
    }
    .status { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand"><span class="live-dot"></span> FOOTBALL PULSE</div>
      <span id="news-count" style="font-size: 0.78rem; color: var(--muted);">در حال دریافت...</span>
    </div>
    <input type="text" id="search" class="search-box" placeholder="جستجوی نام تیم، بازیکن یا مربی..." />
    <div class="filters" id="filters">
      <button class="chip active" data-source="ALL">همه منابع</button>
      <button class="chip" data-source="BBC Sport">BBC Sport</button>
      <button class="chip" data-source="Sky Sports">Sky Sports</button>
      <button class="chip" data-source="ESPN FC">ESPN FC</button>
      <button class="chip" data-source="The Guardian">The Guardian</button>
    </div>
  </header>

  <main class="container" id="feed">
    <div class="status">در حال بارگذاری آخرین اخبار فوتبال جهان...</div>
  </main>

  <script>
    let allNews = [];
    let currentSource = 'ALL';

    async function loadNews() {
      const feedEl = document.getElementById('feed');
      try {
        const res = await fetch('./news.json?t=' + Date.now());
        if (!res.ok) throw new Error('فایل خبری هنوز تولید نشده است.');
        allNews = await res.json();
        renderNews();
      } catch (err) {
        feedEl.innerHTML = `<div class="status">هنوز خبری بارگذاری نشده است. یک بار اکشن گیت‌هاب را دستی اجرا کنید.</div>`;
      }
    }

    function renderNews() {
      const feedEl = document.getElementById('feed');
      const query = document.getElementById('search').value.trim().toLowerCase();

      const filtered = allNews.filter(item => {
        const matchSource = currentSource === 'ALL' || item.source === currentSource;
        const matchSearch = !query || 
          item.title.toLowerCase().includes(query) || 
          item.summary.toLowerCase().includes(query) ||
          (item.original_title && item.original_title.toLowerCase().includes(query));
        return matchSource && matchSearch;
      });

      document.getElementById('news-count').textContent = `${filtered.length} خبر فعال`;

      if (filtered.length === 0) {
        feedEl.innerHTML = `<div class="status">خبری با این مشخصات یافت نشد.</div>`;
        return;
      }

      feedEl.innerHTML = filtered.map(item => `
        <article class="news-card">
          <img class="news-img" src="${item.image}" alt="News" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80'" />
          <div class="news-body">
            <div class="meta">
              <span class="badge">${item.source}</span>
              <span dir="ltr">${item.published.slice(0, 22)}</span>
            </div>
            <h2 class="title">${item.title}</h2>
            <p class="summary">${item.summary}</p>
            <div class="orig-title">${item.original_title || ''}</div>
            <a class="btn-link" href="${item.link}" target="_blank" rel="noopener">مشاهده منبع اصلی ↗</a>
          </div>
        </article>
      `).join('');
    }

    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.classList.contains('chip')) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentSource = e.target.dataset.source;
      renderNews();
    });

    document.getElementById('search').addEventListener('input', renderNews);
    loadNews();
  </script>
</body>
</html>
