<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>فوتبال پالس</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #090d16;
      --surface: #131b2e;
      --surface-light: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; overflow-x: hidden; }
    
    /* App Bar */
    .app-bar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(9, 13, 22, 0.92); backdrop-filter: blur(14px);
      padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .logo { font-size: 1.2rem; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .pulse { width: 9px; height: 9px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 12px var(--accent); animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .refresh-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; }

    .search-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; outline: none; margin-bottom: 10px;
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; white-space: nowrap; cursor: pointer;
    }
    .chip.active { background: var(--accent); color: #052e16; font-weight: 800; border-color: var(--accent); }

    /* Featured Hero Card */
    .container { padding: 14px 16px; max-width: 600px; margin: 0 auto; }
    .hero-card {
      position: relative; border-radius: 18px; overflow: hidden; height: 230px;
      margin-bottom: 18px; border: 1px solid var(--border); cursor: pointer;
    }
    .hero-card img { width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(9,13,22,0.96) 15%, rgba(9,13,22,0.2) 100%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 16px;
    }
    .badge { align-self: flex-start; background: var(--accent); color: #052e16; font-size: 0.7rem; font-weight: 800; padding: 3px 9px; border-radius: 6px; margin-bottom: 8px; }
    .hero-title { font-size: 1.05rem; font-weight: 800; line-height: 1.5; color: #fff; }

    /* Compact News List */
    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-item {
      display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px; align-items: center; cursor: pointer;
    }
    .thumb { width: 95px; height: 85px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #000; }
    .item-content { flex: 1; min-width: 0; }
    .item-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--accent); margin-bottom: 4px; font-weight: 700; }
    .item-title { font-size: 0.9rem; font-weight: 700; line-height: 1.5; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Reader Bottom Sheet Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: var(--surface); width: 100%; max-width: 600px; max-height: 88vh;
      border-radius: 22px 22px 0 0; overflow-y: auto; padding: 18px; border-top: 1px solid var(--border);
    }
    .modal-img { width: 100%; height: 210px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; }
    .modal-title { font-size: 1.1rem; font-weight: 800; line-height: 1.6; margin-bottom: 12px; }
    .modal-summary { font-size: 0.92rem; line-height: 1.85; color: #cbd5e1; margin-bottom: 14px; user-select: text; }
    .modal-orig { font-size: 0.78rem; color: var(--muted); direction: ltr; text-align: left; background: var(--bg); padding: 10px; border-radius: 10px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; }
    .btn-main { flex: 1; text-align: center; background: var(--accent); color: #052e16; font-weight: 800; padding: 11px; border-radius: 10px; text-decoration: none; font-size: 0.88rem; }
    .btn-close { background: var(--surface-light); color: var(--text); border: none; padding: 11px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .status { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header class="app-bar">
    <div class="top-row">
      <div class="logo"><span class="pulse"></span> FOOTBALL PULSE</div>
      <button class="refresh-btn" onclick="loadNews()">بروزرسانی ↻</button>
    </div>
    <input type="text" id="search" class="search-input" placeholder="جستجوی تیم، بازیکن یا مربی..." />
    <div class="chips" id="filters">
      <button class="chip active" data-source="ALL">همه خبرها</button>
      <button class="chip" data-source="BBC Sport">BBC Sport</button>
      <button class="chip" data-source="Sky Sports">Sky Sports</button>
      <button class="chip" data-source="ESPN FC">ESPN FC</button>
      <button class="chip" data-source="The Guardian">The Guardian</button>
    </div>
  </header>

  <main class="container" id="app-content">
    <div class="status">در حال دریافت آخرین اخبار فوتبال...</div>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" id="modal-body"></div>
  </div>

  <script>
    const GITHUB_REPO = "frankalayari-beep/soccernews";
    const REMOTE_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/news.json`;

    let allNews = [];
    let currentSource = 'ALL';

    async function loadNews() {
      const container = document.getElementById('app-content');
      container.innerHTML = `<div class="status">در حال بروزرسانی اخبار...</div>`;
      try {
        const res = await fetch(REMOTE_JSON_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('خطا در دریافت');
        allNews = await res.json();
        render();
      } catch (e) {
        container.innerHTML = `<div class="status">خطا در اتصال به سرور خبری. از عمومی (Public) بودن مخزن و وجود فایل news.json مطمئن شوید.</div>`;
      }
    }

    function render() {
      const container = document.getElementById('app-content');
      const q = document.getElementById('search').value.trim().toLowerCase();

      const list = allNews.filter(n => {
        const matchSrc = currentSource === 'ALL' || n.source === currentSource;
        const matchQ = !q || n.title.toLowerCase().includes(q) || n.summary.toLowerCase().includes(q);
        return matchSrc && matchQ;
      });

      if (!list.length) {
        container.innerHTML = `<div class="status">خبری یافت نشد.</div>`;
        return;
      }

      const hero = list[0];
      const rest = list.slice(1);

      let html = `
        <div class="hero-card" onclick="openModal(0)">
          <img src="${hero.image}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'" />
          <div class="hero-overlay">
            <span class="badge">${hero.source} • خبر ویژه</span>
            <h2 class="hero-title">${hero.title}</h2>
          </div>
        </div>
        <div class="news-list">
      `;

      rest.forEach((item, idx) => {
        html += `
          <div class="news-item" onclick="openModal(${idx + 1})">
            <img class="thumb" src="${item.image}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=400&q=80'" />
            <div class="item-content">
              <div class="item-meta">
                <span>${item.source}</span>
                <span dir="ltr">${item.published.slice(5, 16)}</span>
              </div>
              <h3 class="item-title">${item.title}</h3>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      window.currentFilteredList = list;
    }

    function openModal(index) {
      const item = window.currentFilteredList[index];
      if (!item) return;
      document.getElementById('modal-body').innerHTML = `
        <img class="modal-img" src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'" />
        <span class="badge">${item.source}</span>
        <h2 class="modal-title">${item.title}</h2>
        <p class="modal-summary">${item.summary}</p>
        <div class="modal-orig"><strong>Original Headline:</strong><br>${item.original_title || ''}</div>
        <div class="modal-actions">
          <a class="btn-main" href="${item.link}" target="_blank">مشاهده کامل در سایت مرجع ↗</a>
          <button class="btn-close" onclick="closeModal()">بستن</button>
        </div>
      `;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.classList.contains('chip')) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentSource = e.target.dataset.source;
      render();
    });

    document.getElementById('search').addEventListener('input', render);
    loadNews();
  </script>
</body>
</html>
