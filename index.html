<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>فوتبال پالس</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #090d16;
      --surface: #131b2e;
      --surface-light: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; overflow-x: hidden; }
    
    /* App Bar */
    .app-bar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(9, 13, 22, 0.94); backdrop-filter: blur(14px);
      padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .logo { font-size: 1.2rem; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .pulse { width: 9px; height: 9px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 12px var(--accent); animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .refresh-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; }

    .search-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; outline: none; margin-bottom: 10px;
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; white-space: nowrap; cursor: pointer;
    }
    .chip.active { background: var(--accent); color: #052e16; font-weight: 800; border-color: var(--accent); }

    /* Main Feed */
    .container { padding: 14px 16px; max-width: 600px; margin: 0 auto; }
    .hero-card {
      position: relative; border-radius: 18px; overflow: hidden; height: 235px;
      margin-bottom: 18px; border: 1px solid var(--border); cursor: pointer;
    }
    .hero-card img { width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(9,13,22,0.96) 15%, rgba(9,13,22,0.15) 100%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 16px;
    }
    .badge { align-self: flex-start; background: var(--accent); color: #052e16; font-size: 0.72rem; font-weight: 800; padding: 3px 10px; border-radius: 6px; margin-bottom: 8px; }
    .hero-title { font-size: 1.05rem; font-weight: 800; line-height: 1.55; color: #fff; }

    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-item {
      display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px; align-items: center; cursor: pointer;
    }
    .thumb { width: 98px; height: 86px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #000; }
    .item-content { flex: 1; min-width: 0; }
    .item-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--accent); margin-bottom: 4px; font-weight: 700; }
    .item-title { font-size: 0.9rem; font-weight: 700; line-height: 1.55; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Full-Screen Standalone Article View */
    .article-page {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      overflow-y: auto; display: none; flex-direction: column;
      animation: slideIn 0.22s ease-out;
    }
    @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .article-page.open { display: flex; }
    .article-topbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(9, 13, 22, 0.92); backdrop-filter: blur(12px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .back-btn, .share-btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 7px 14px; border-radius: 10px; font-size: 0.84rem; font-weight: 700; cursor: pointer;
    }
    .article-container { max-width: 600px; margin: 0 auto; width: 100%; padding-bottom: 40px; }
    .article-hero-img { width: 100%; height: 250px; object-fit: cover; display: block; background: #000; }
    .article-body { padding: 18px 16px; }
    .article-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.78rem; color: var(--muted); }
    .article-headline { font-size: 1.22rem; font-weight: 900; line-height: 1.65; color: #fff; margin-bottom: 16px; user-select: text; }
    .article-lead {
      background: var(--surface); border-right: 4px solid var(--accent);
      padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; font-weight: 700;
      line-height: 1.8; color: #e2e8f0; margin-bottom: 18px; user-select: text;
    }
    .article-paragraph {
      font-size: 0.96rem; line-height: 2; color: #cbd5e1;
      margin-bottom: 16px; text-align: justify; user-select: text;
    }
    .status { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header class="app-bar">
    <div class="top-row">
      <div class="logo"><span class="pulse"></span> FOOTBALL PULSE</div>
      <button class="refresh-btn" onclick="loadNews()">بروزرسانی ↻</button>
    </div>
    <input type="text" id="search" class="search-input" placeholder="جستجوی نام تیم، بازیکن یا مربی..." />
    <div class="chips" id="filters">
      <button class="chip active" data-source="ALL">همه خبرها</button>
      <button class="chip" data-source="BBC Sport">بی‌بی‌سی اسپورت</button>
      <button class="chip" data-source="Sky Sports">اسکای اسپورتس</button>
      <button class="chip" data-source="The Guardian">گاردین</button>
      <button class="chip" data-source="ESPN FC">ای‌اس‌پی‌ان</button>
    </div>
  </header>

  <main class="container" id="app-content">
    <div class="status">در حال دریافت آخرین اخبار فوتبال...</div>
  </main>

  <!-- صفحه کامل خبر در داخل اپ -->
  <div class="article-page" id="article-page">
    <div class="article-topbar">
      <button class="back-btn" onclick="closeArticle()">→ بازگشت به اخبار</button>
      <button class="share-btn" id="share-btn">اشتراک‌گذاری خبر</button>
    </div>
    <div class="article-container" id="article-content"></div>
  </div>

  <script>
    const GITHUB_REPO = "frankalayari-beep/soccernews";
    const REMOTE_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/news.json`;

    let allNews = [];
    let currentSource = 'ALL';

    const SOURCE_FA = {
      "BBC Sport": "بی‌بی‌سی اسپورت",
      "Sky Sports": "اسکای اسپورتس",
      "The Guardian": "گاردین ورزشی",
      "ESPN FC": "ای‌اس‌پی‌ان فوتبال"
    };

    async function loadNews() {
      const container = document.getElementById('app-content');
      container.innerHTML = `<div class="status">در حال دریافت آخرین اخبار روز فوتبال...</div>`;
      try {
        const res = await fetch(REMOTE_JSON_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('خطا در دریافت');
        allNews = await res.json();
        render();
      } catch (e) {
        container.innerHTML = `<div class="status">خطا در ارتباط. لطفاً اتصال اینترنت خود را بررسی کنید.</div>`;
      }
    }

    function render() {
      const container = document.getElementById('app-content');
      const q = document.getElementById('search').value.trim().toLowerCase();

      const list = allNews.filter(n => {
        const matchSrc = currentSource === 'ALL' || n.source === currentSource;
        const bodyText = Array.isArray(n.content) ? n.content.join(' ') : (n.summary || '');
        const matchQ = !q || n.title.toLowerCase().includes(q) || bodyText.toLowerCase().includes(q);
        return matchSrc && matchQ;
      });

      if (!list.length) {
        container.innerHTML = `<div class="status">خبری در این بخش یافت نشد.</div>`;
        return;
      }

      const hero = list[0];
      const rest = list.slice(1);

      let html = `
        <div class="hero-card" onclick="openArticle(0)">
          <img src="${hero.image}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'" />
          <div class="hero-overlay">
            <span class="badge">${SOURCE_FA[hero.source] || hero.source} • خبر ویژه</span>
            <h2 class="hero-title">${hero.title}</h2>
          </div>
        </div>
        <div class="news-list">
      `;

      rest.forEach((item, idx) => {
        html += `
          <div class="news-item" onclick="openArticle(${idx + 1})">
            <img class="thumb" src="${item.image}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=400&q=80'" />
            <div class="item-content">
              <div class="item-meta">
                <span>${SOURCE_FA[item.source] || item.source}</span>
                <span dir="ltr">${(item.published || '').slice(5, 16)}</span>
              </div>
              <h3 class="item-title">${item.title}</h3>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      window.currentFilteredList = list;
    }

    function openArticle(index) {
      const item = window.currentFilteredList[index];
      if (!item) return;

      const paragraphs = Array.isArray(item.content) && item.content.length > 0
        ? item.content
        : [item.summary || 'متن کامل این خبر در حال بروزرسانی است.'];

      const leadText = paragraphs[0];
      const bodyParagraphs = paragraphs.slice(1);

      let bodyHtml = bodyParagraphs.map(p => `<p class="article-paragraph">${p}</p>`).join('');
      if (!bodyHtml) {
        bodyHtml = `<p class="article-paragraph">${leadText}</p>`;
      }

      document.getElementById('article-content').innerHTML = `
        <img class="article-hero-img" src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'" />
        <div class="article-body">
          <div class="article-meta-row">
            <span class="badge" style="margin:0">${SOURCE_FA[item.source] || item.source}</span>
            <span dir="ltr">${(item.published || '').slice(0, 16)}</span>
          </div>
          <h1 class="article-headline">${item.title}</h1>
          <div class="article-lead">${leadText}</div>
          ${bodyHtml}
        </div>
      `;

      document.getElementById('share-btn').onclick = () => {
        const shareText = `${item.title}\n\n${leadText}\n\n📱 اپلیکیشن فوتبال پالس`;
        if (navigator.share) {
          navigator.share({ title: item.title, text: shareText });
        } else {
          navigator.clipboard.writeText(shareText);
          alert('متن خبر کپی شد!');
        }
      };

      const page = document.getElementById('article-page');
      page.classList.add('open');
      page.scrollTop = 0;
      document.body.style.overflow = 'hidden';
      history.pushState({ articleOpen: true }, "");
    }

    function closeArticle() {
      const page = document.getElementById('article-page');
      if (page.classList.contains('open')) {
        page.classList.remove('open');
        document.body.style.overflow = '';
      }
    }

    window.addEventListener('popstate', () => {
      closeArticle();
    });

    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.classList.contains('chip')) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentSource = e.target.dataset.source;
      render();
    });

    document.getElementById('search').addEventListener('input', render);
    loadNews();
  </script>
</body>
</html>
