name: Build Signed Release APK (Bazaar & Myket)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Prepare Web Assets
        run: |
          npm install
          npm run build
          npx cap init "Football Pulse" "ir.footballpulse.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate Keystore & Sign Release APK
        working-directory: ./android
        run: |
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias appkey -storepass 123456 -keypass 123456 \
            -dname "CN=FootballPulse, OU=Mobile, O=SportApp, L=Mashhad, S=Khorasan, C=IR"

          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=appkey \
            -Pandroid.injected.signing.key.password=123456

      - name: Rename and Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./FootballPulse-Release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootballPulse-Bazaar-Myket-APK
          path: ./FootballPulse-Release.apk
