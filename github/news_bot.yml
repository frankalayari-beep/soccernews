name: Auto Fetch & Translate Football News

on:
  schedule:
    - cron: '*/30 * * * *' # اجرا در هر ۳۰ دقیقه
  workflow_dispatch: # امکان اجرای دستی با یک کلیک

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run News Scraper & Translator
        run: python fetch_news.py

      - name: Commit and Push Updated News
        run: |
          git config --global user.name "Football News Bot"
          git config --global user.email "bot@github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Auto-update football news" && git push)
